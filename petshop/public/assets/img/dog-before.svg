  <path d="M324 150c64 30 76 122 56 182-6 18-24 26-40 20-22-8-30-34-32-72-4-58 4-104 16-130Z" fill="#A87A45" stroke="#0F1D18" stroke-width="5"/>
  <path d="M376 300l16 34-34-16Zm-22 22l10 36-32-24Zm-30 6l-2 34-24-30Z" fill="#A87A45" stroke="#0F1D18" stroke-width="5" stroke-linejoin="round"/>

  <!-- fur ring -->
  <path d="M250 80 296.7 67.3 288.3 87.6 336.3 93.7 320.7 109.3 362.7 133.3 342.4 141.7 372 180 342.4 218.3 362.7 226.7 320.7 250.7 336.3 266.3 288.3 272.4 296.7 292.7 250 302 203.3 292.7 211.7 272.4 163.7 266.3 179.3 250.7 137.3 226.7 157.6 218.3 128 180 157.6 141.7 137.3 133.3 179.3 109.3 163.7 93.7 211.7 87.6 203.3 67.3Z"
        fill="#C08F52" stroke="#0F1D18" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="250" cy="182" rx="97" ry="93" fill="#C08F52"/>

  <!-- eyes, then the fringe falling over them -->
  <ellipse cx="214" cy="176" rx="11" ry="13" fill="#1A1310"/>
  <ellipse cx="286" cy="176" rx="11" ry="13" fill="#1A1310"/>
  <circle cx="218" cy="171" r="4" fill="#FFFFFF"/>
  <circle cx="290" cy="171" r="4" fill="#FFFFFF"/>
  <path d="M174 140q76-46 152 0-10 44-38 44-6-24-24-24-18 0-24 24-16 0-24-24-18 0-24 24-28 0-34-44Z" fill="#A87A45" stroke="#0F1D18" stroke-width="5" stroke-linejoin="round"/>

  <!-- muzzle -->
  <ellipse cx="250" cy="228" rx="58" ry="44" fill="#E8D3B0"/>
  <path d="M234 212q16-14 32 0-5 18-16 18t-16-18Z" fill="#1A1310"/>
  <path d="M250 230q-14 16-28 8m28-8q14 16 28 8" fill="none" stroke="#1A1310" stroke-width="5" stroke-linecap="round"/>

