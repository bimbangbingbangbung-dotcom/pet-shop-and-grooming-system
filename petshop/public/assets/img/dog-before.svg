  <path d="M150 356l14-30 10 26 16-34 10 30 18-36 12 32 18-38 12 34 18-36 12 32 16-30 10 26 14-28 10 24" fill="#C08F52" stroke="#0F1D18" stroke-width="5" stroke-linejoin="round"/>
  <path d="M212 356q-4-74 38-74t38 74Z" fill="#E8D3B0"/>

