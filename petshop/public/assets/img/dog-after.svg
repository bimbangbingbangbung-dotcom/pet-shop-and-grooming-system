  <!-- eyes -->
  <ellipse cx="214" cy="172" rx="11" ry="13" fill="#1A1310"/>
  <ellipse cx="286" cy="172" rx="11" ry="13" fill="#1A1310"/>
  <circle cx="218" cy="167" r="4" fill="#FFFFFF"/>
  <circle cx="290" cy="167" r="4" fill="#FFFFFF"/>

  <!-- muzzle -->
  <ellipse cx="250" cy="226" rx="58" ry="44" fill="#F0DFC4"/>
  <path d="M234 210q16-14 32 0-5 18-16 18t-16-18Z" fill="#1A1310"/>
  <path d="M250 228q-14 16-28 8m28-8q14 16 28 8" fill="none" stroke="#1A1310" stroke-width="5" stroke-linecap="round"/>

  <!-- bandana -->
  <path d="M186 268q64 36 128 0l-16 54q-48 26-96 0Z" fill="#E2542C" stroke="#0F1D18" stroke-width="5" stroke-linejoin="round"/>
  <path d="M232 322l-10 40 34-40 34 40-10-40" fill="#C9451F" stroke="#0F1D18" stroke-width="5" stroke-linejoin="round"/>
  <path d="M210 282q40 20 80 0" fill="none" stroke="#F0DFC4" stroke-width="5" stroke-linecap="round"/>
