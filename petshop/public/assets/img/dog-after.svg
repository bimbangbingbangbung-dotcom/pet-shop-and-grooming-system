<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" role="img" aria-label="The same terrier after a full groom: clipped short, clean, with a coral bandana">
  <rect width="500" height="400" fill="#F0F4F1"/>
  <g stroke="#DDE7E0" stroke-width="2">
    <path d="M0 100h500M0 200h500M0 300h500M100 0v400M200 0v400M300 0v400M400 0v400"/>
  </g>
  <ellipse cx="250" cy="356" rx="146" ry="20" fill="#0F1D18" opacity=".13"/>

  <!-- smooth body -->
  <path d="M150 356q0-116 100-116t100 116Z" fill="#D9A15B" stroke="#0F1D18" stroke-width="5" stroke-linejoin="round"/>
  <path d="M208 356q0-76 42-76t42 76Z" fill="#F0DFC4"/>

  <!-- neat ears -->
  <path d="M178 152c-56 26-70 116-52 176 6 20 26 28 44 20 20-10 26-40 26-84 2-56 0-96-18-112Z" fill="#C4863F" stroke="#0F1D18" stroke-width="5"/>
  <path d="M322 152c56 26 70 116 52 176-6 20-26 28-44 20-20-10-26-40-26-84-2-56 0-96 18-112Z" fill="#C4863F" stroke="#0F1D18" stroke-width="5"/>

  <!-- head -->
